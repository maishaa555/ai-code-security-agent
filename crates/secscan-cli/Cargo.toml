[package]
name = "secscan-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "secscan"
path = "src/main.rs"

[dependencies]
secscan-core = { path = "../secscan-core" }
secscan-nebius = { path = "../secscan-nebius" }
secscan-agent = { path = "../secscan-agent" }
clap = { version = "4.4", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
colored = "2.1"

[workspace]
resolver = "2"
members = [
    "crates/secscan-core",
    "crates/secscan-nebius",
    "crates/secscan-agent",
    "crates/secscan-cli",
    "crates/secscan-server",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
tree-sitter = "0.20"
tree-sitter-python = "0.20"
regex = "1.10"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
